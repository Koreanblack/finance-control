{% extends 'base.html' %}
{% block title %}{% if edit_mode %}Editar{% else %}Nueva{% endif %} Transacción — Control de Finanzas{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="d-flex align-items-center mb-4">
      <a href="{{ url_for('transactions') }}" class="btn btn-sm btn-outline-secondary me-3">
        <i class="bi bi-arrow-left"></i>
      </a>
      <h2 class="fw-bold mb-0">
        <i class="bi bi-{% if edit_mode %}pencil-square{% else %}plus-circle{% endif %} me-2 text-primary"></i>
        {% if edit_mode %}Editar Transacción{% else %}Nueva Transacción{% endif %}
      </h2>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <form method="post"
              action="{% if edit_mode %}{{ url_for('edit_transaction', txn_id=txn_id) }}{% else %}{{ url_for('add_transaction') }}{% endif %}">

          <!-- Type selector tabs -->
          <div class="mb-4">
            <label class="form-label fw-semibold">Tipo de transacción</label>
            <div class="btn-group w-100" role="group" id="typeGroup">
              <input type="radio" class="btn-check" name="type" id="type_ingreso" value="ingreso"
                     {% if (form.get('type') or 'egreso') == 'ingreso' %}checked{% endif %} />
              <label class="btn btn-outline-success" for="type_ingreso">
                <i class="bi bi-arrow-down-circle me-1"></i>Ingreso
              </label>

              <input type="radio" class="btn-check" name="type" id="type_egreso" value="egreso"
                     {% if (form.get('type') or 'egreso') == 'egreso' %}checked{% endif %} />
              <label class="btn btn-outline-danger" for="type_egreso">
                <i class="bi bi-arrow-up-circle me-1"></i>Egreso
              </label>

              <input type="radio" class="btn-check" name="type" id="type_transferencia" value="transferencia"
                     {% if form.get('type') == 'transferencia' %}checked{% endif %} />
              <label class="btn btn-outline-info" for="type_transferencia">
                <i class="bi bi-arrow-left-right me-1"></i>Transferencia
              </label>
            </div>
          </div>

          <div class="row g-3">
            <!-- Date -->
            <div class="col-sm-6">
              <label for="date" class="form-label fw-semibold">Fecha</label>
              <input type="date" id="date" name="date" class="form-control"
                     value="{{ form.get('date') or today }}" required />
            </div>

            <!-- Amount -->
            <div class="col-sm-6">
              <label for="amount" class="form-label fw-semibold">Monto ($)</label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="number" id="amount" name="amount" class="form-control"
                       placeholder="0.00" min="0.01" step="0.01"
                       value="{{ form.get('amount') or '' }}" required />
              </div>
            </div>

            <!-- Description -->
            <div class="col-12">
              <label for="description" class="form-label fw-semibold">Descripción</label>
              <input type="text" id="description" name="description" class="form-control"
                     placeholder="Ej. Supermercado DIA, Sueldo, etc."
                     value="{{ form.get('description') or '' }}" required />
            </div>

            <!-- Wallet -->
            <div class="col-sm-6">
              <label for="wallet" class="form-label fw-semibold">Billetera origen</label>
              <select id="wallet" name="wallet" class="form-select" required>
                <option value="">Seleccionar...</option>
                {% for w in wallets %}
                <option value="{{ w }}" {% if form.get('wallet') == w %}selected{% endif %}>{{ w }}</option>
                {% endfor %}
              </select>
            </div>

            <!-- Wallet destination (transferencia only) -->
            <div class="col-sm-6" id="walletDestGroup" style="display:none;">
              <label for="wallet_destination" class="form-label fw-semibold">Billetera destino</label>
              <select id="wallet_destination" name="wallet_destination" class="form-select">
                <option value="">Seleccionar...</option>
                {% for w in wallets %}
                <option value="{{ w }}" {% if form.get('wallet_destination') == w %}selected{% endif %}>{{ w }}</option>
                {% endfor %}
              </select>
            </div>

            <!-- Category (egreso only) -->
            <div class="col-sm-6" id="categoryGroup" style="display:none;">
              <label for="category" class="form-label fw-semibold">Categoría</label>
              <select id="category" name="category" class="form-select">
                <option value="">Sin categoría</option>
                {% for c in categories %}
                <option value="{{ c }}" {% if form.get('category') == c %}selected{% endif %}>{{ c }}</option>
                {% endfor %}
              </select>
            </div>

            <!-- Notes -->
            <div class="col-12">
              <label for="notes" class="form-label fw-semibold">Notas <span class="text-muted fw-normal">(opcional)</span></label>
              <textarea id="notes" name="notes" class="form-control" rows="2"
                        placeholder="Información adicional...">{{ form.get('notes') or '' }}</textarea>
            </div>
          </div>

          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary flex-grow-1">
              <i class="bi bi-check-circle me-1"></i>
              {% if edit_mode %}Guardar cambios{% else %}Agregar transacción{% endif %}
            </button>
            <a href="{{ url_for('transactions') }}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const typeInputs = document.querySelectorAll('input[name="type"]');
  const categoryGroup = document.getElementById('categoryGroup');
  const walletDestGroup = document.getElementById('walletDestGroup');
  const walletDestSelect = document.getElementById('wallet_destination');
  const categorySelect = document.getElementById('category');

  function updateFields() {
    const selected = document.querySelector('input[name="type"]:checked');
    if (!selected) return;
    const type = selected.value;

    if (type === 'egreso') {
      categoryGroup.style.display = '';
      walletDestGroup.style.display = 'none';
      walletDestSelect.removeAttribute('required');
    } else if (type === 'transferencia') {
      categoryGroup.style.display = 'none';
      walletDestGroup.style.display = '';
      walletDestSelect.setAttribute('required', 'required');
      categorySelect.value = '';
    } else {
      // ingreso
      categoryGroup.style.display = 'none';
      walletDestGroup.style.display = 'none';
      walletDestSelect.removeAttribute('required');
      categorySelect.value = '';
    }
  }

  typeInputs.forEach(input => input.addEventListener('change', updateFields));
  // Run on page load
  updateFields();
</script>
{% endblock %}
